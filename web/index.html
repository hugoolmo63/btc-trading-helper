<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC Trading Helper</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="hero-market">
        <div class="hero-label">BTC / EUR</div>
        <div id="hero-btc-price" class="hero-price">—</div>
        <div class="hero-updated"><span data-i18n="updated"></span> <span id="hero-btc-updated">—</span></div>
        <div class="hero-context">
          <span id="hero-regime" class="regime-badge">—</span>
          <div class="signal-xray-wrap">
            <button id="hero-signal" class="signal-pill" type="button" aria-expanded="false" aria-controls="signal-xray" data-i18n-title="signal_why_tooltip">
              <span id="hero-signal-value">—</span><span class="signal-pill-help" aria-hidden="true">ⓘ</span>
            </button>
            <section id="signal-xray" class="signal-xray" aria-labelledby="signal-xray-title" hidden>
              <div class="signal-xray-heading"><h2 id="signal-xray-title" data-i18n="signal_xray_title"></h2><span id="signal-xray-zone" class="signal-zone-badge">—</span></div>
              <p id="signal-xray-summary" class="signal-xray-summary"></p>
              <div class="signal-gauge" role="img" data-i18n-aria-label="signal_gauge_aria">
                <div class="signal-gauge-track"><div id="signal-gauge-fill" class="signal-gauge-fill"></div></div>
                <span class="signal-gauge-marker marker-accumulate"><i></i><b>30%</b></span>
                <span class="signal-gauge-marker marker-deploy"><i></i><b>60%</b></span>
              </div>
              <div class="signal-gauge-labels"><span data-i18n="signal_zone_cash"></span><span data-i18n="signal_zone_dca"></span><span data-i18n="signal_zone_deploy"></span></div>
              <div class="signal-drivers-heading"><h3 data-i18n="signal_drivers_title"></h3><span data-i18n="signal_contribution_note"></span></div>
              <div id="signal-drivers" class="signal-drivers"></div>
              <p class="signal-xray-disclaimer" data-i18n="signal_xray_disclaimer"></p>
            </section>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <div class="language-switcher"><button data-lang="es">ES</button><span>|</span><button data-lang="en">EN</button></div>
        <button id="theme-toggle" class="theme-toggle" type="button"></button>
        <button id="deposit-open" class="secondary" type="button" data-i18n="add_capital"></button>
        <button id="refresh" class="primary" data-i18n="refresh"></button>
      </div>
    </header>
    <div id="deposit-modal" class="deposit-modal" hidden>
      <form id="deposit-form" class="deposit-card">
        <div class="deposit-heading">
          <h2 data-i18n="add_capital_title"></h2>
          <button id="deposit-cancel-x" class="icon-button" type="button" aria-label="Close">×</button>
        </div>
        <div class="deposit-chips">
          <button type="button" data-deposit-amount="500">€500</button>
          <button type="button" data-deposit-amount="1000">€1,000</button>
          <button type="button" data-deposit-amount="2500">€2,500</button>
        </div>
        <label class="deposit-input">
          <span data-i18n="amount_eur"></span>
          <span class="currency-input"><span>€</span><input id="deposit-amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="500" required></span>
        </label>
        <p class="deposit-note" data-i18n="deposit_note"></p>
        <p id="deposit-error" class="deposit-error" role="alert"></p>
        <div class="deposit-actions">
          <button id="deposit-cancel" class="secondary" type="button" data-i18n="cancel"></button>
          <button id="deposit-submit" class="primary" type="submit" data-i18n="confirm_deposit"></button>
        </div>
      </form>
    </div>
    <div id="status" class="status"></div>
    <section class="profile-switcher" aria-label="Profile selector">
      <button class="profile-button" data-profile="dca_holder" aria-pressed="false" data-i18n="profile_a"></button>
      <button class="profile-button" data-profile="cycle_ml_trader" aria-pressed="false" data-i18n="profile_b">Perfil B: Cycle-ML Trader</button>
    </section>
    <section id="portfolio-hero-card" class="portfolio-hero-card" data-i18n-aria-label="portfolio_aria">
      <div class="portfolio-net-worth">
        <div class="portfolio-section-label" data-i18n="net_equity"></div>
        <div id="portfolio-equity" class="portfolio-equity">—</div>
        <div class="portfolio-btc-line"><span class="portfolio-btc-label" data-i18n="net_btc"></span><strong id="portfolio-net-btc">—</strong></div>
        <div id="portfolio-roi" class="portfolio-roi"></div>
        <div id="portfolio-alpha" class="portfolio-alpha"></div>
      </div>
      <div class="portfolio-allocation">
        <div class="portfolio-section-label" data-i18n="allocation_title"></div>
        <div id="allocation-bar" class="allocation-bar" role="img" aria-label="Portfolio allocation">
          <span id="allocation-btc-segment" class="allocation-segment allocation-btc"></span>
          <span id="allocation-cash-segment" class="allocation-segment allocation-cash"></span>
        </div>
        <div class="allocation-metrics">
          <div class="allocation-metric allocation-metric-btc"><span data-i18n="allocation_btc"></span><strong id="allocation-btc-value">—</strong><small id="allocation-btc-amount">—</small></div>
          <div class="allocation-metric allocation-metric-cash"><span data-i18n="allocation_cash"></span><strong id="allocation-cash-value">—</strong><small id="allocation-cash-amount">—</small></div>
          <div id="allocation-escrow" class="allocation-metric allocation-metric-escrow"><span data-i18n="tax_escrow_value"></span><strong id="allocation-escrow-value">—</strong></div>
        </div>
      </div>
    </section>
    <section class="dca-plan" aria-labelledby="dca-plan-title">
      <div class="dca-plan-summary">
        <div class="dca-plan-heading">
          <h2 id="dca-plan-title" class="visually-hidden" data-i18n="dca_plan_title"></h2>
          <span id="dca-status" class="dca-status"></span>
          <span id="dca-rule" class="dca-rule">—</span>
          <span id="dca-next" class="dca-next"></span>
        </div>
        <button id="dca-edit-open" class="secondary" type="button" data-i18n="edit_plan" aria-expanded="false" aria-controls="dca-editor"></button>
      </div>
      <form id="dca-editor" class="dca-editor" aria-hidden="true" inert>
        <div class="dca-editor-grid">
          <label class="dca-toggle-row"><input id="dca-enabled" type="checkbox"><span class="dca-toggle"></span><span id="dca-enabled-label"></span></label>
          <label class="dca-field"><span data-i18n="dca_frequency"></span><select id="dca-frequency"><option value="weekly" data-i18n="dca_weekly"></option><option value="monthly" data-i18n="dca_monthly"></option></select></label>
          <label class="dca-field"><span id="dca-day-label"></span><select id="dca-day"></select></label>
          <label class="deposit-input"><span data-i18n="amount_eur"></span><span class="currency-input"><span>€</span><input id="dca-amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></span></label>
        </div>
        <div class="dca-chips" aria-label="Quick amount selection">
          <button type="button" data-dca-amount="50">€50</button><button type="button" data-dca-amount="100">€100</button><button type="button" data-dca-amount="250">€250</button><button type="button" data-dca-amount="500">€500</button>
        </div>
        <p class="dca-note" data-i18n="dca_profile_note"></p>
        <p id="dca-error" class="deposit-error" role="alert"></p>
        <div class="deposit-actions"><button id="dca-cancel" class="secondary" type="button" data-i18n="cancel"></button><button id="dca-save" class="primary" type="submit" data-i18n="save_plan"></button></div>
      </form>
    </section>
    <details id="tax-panel" class="panel tax-panel" open>
      <summary class="tax-panel-summary"><span data-i18n="tax_panel_title"></span><span data-i18n="tax_panel_subtitle"></span></summary>
      <div class="tax-panel-grid">
        <section class="tax-inventory">
          <h3 data-i18n="tax_live_title"></h3>
          <div id="tax-kpis" class="tax-kpis"></div>
          <div class="tax-progress-wrap">
            <div class="tax-progress-heading"><span data-i18n="tax_headroom"></span><span id="tax-headroom-value">—</span></div>
            <div class="tax-progress-track"><div id="tax-progress" class="tax-progress"></div></div>
          </div>
          <div class="tax-table-wrap"><table class="tax-table"><thead><tr>
            <th data-i18n="tax_acquired"></th><th data-i18n="tax_btc_remaining"></th><th data-i18n="tax_unit_cost"></th><th data-i18n="tax_unrealized"></th>
          </tr></thead><tbody id="tax-lots"></tbody></table></div>
          <a id="tax-export" class="secondary tax-export" href="#" data-i18n="tax_export"></a>
        </section>
        <section class="tax-simulator">
          <h3 data-i18n="withdrawal_title"></h3>
          <label class="deposit-input"><span data-i18n="withdrawal_target"></span><span class="currency-input"><span>€</span><input id="withdrawal-target" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="1500"></span></label>
          <div class="withdrawal-chips"><button type="button" data-withdrawal-amount="500">€500</button><button type="button" data-withdrawal-amount="1500">€1,500</button><button type="button" data-withdrawal-amount="5000">€5,000</button></div>
          <button id="withdrawal-simulate" class="primary" type="button" data-i18n="withdrawal_simulate"></button>
          <p id="withdrawal-warning" class="withdrawal-warning" role="status"></p>
          <div id="withdrawal-results" class="withdrawal-results" hidden></div>
          <div id="withdrawal-lots" class="withdrawal-lots"></div>
        </section>
      </div>
    </details>
    <section class="panel">
      <div class="panel-title"><h2 data-i18n="portfolio_performance"></h2><span data-i18n="local_time"></span></div>
      <div id="equity-chart" class="chart"></div>
      <div id="net-btc-chart" class="chart"></div>
      <div id="signal-chart" class="chart"></div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2 data-i18n="historical_regimes"></h2><span data-i18n="historical"></span></div>
      <div id="cycle-chart" class="chart tall"></div>
      <div id="indicators-chart" class="chart"></div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2 data-i18n="trade_ledger"></h2><span data-i18n="most_recent_first"></span></div>
      <div class="table-wrap"><table><thead><tr>
        <th data-i18n="profile"></th><th data-i18n="timestamp"></th><th data-i18n="side"></th><th data-i18n="price"></th><th data-i18n="notional"></th><th data-i18n="fee"></th>
      </tr></thead><tbody id="trades"></tbody></table></div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2 data-i18n="recurring_diagnostics"></h2><span data-i18n="purged_folds"></span></div>
      <div id="drawdown-chart" class="chart"></div>
      <div id="attribution-chart" class="chart"></div>
    </section>
    <footer id="operational-status"></footer>
  </main>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
