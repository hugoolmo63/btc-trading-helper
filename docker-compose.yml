services:
  web:
    build:
      context: .
    image: btc-trading-helper:latest
    environment:
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./web:/app/web
      - ./data:/app/data
      - ./models:/app/models
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8501
    restart: unless-stopped

  paper-trader:
    build:
      context: .
    image: btc-trading-helper:latest
    environment:
      PYTHONPATH: /app
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./data:/app/data
      - ./models:/app/models
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          python -m src.execution.paper_trader || echo "paper trader failed; retrying"
          minute=$$(date -u +%M)
          second=$$(date -u +%S)
          minute=$${minute#0}
          second=$${second#0}
          [ -n "$$minute" ] || minute=0
          [ -n "$$second" ] || second=0
          if [ "$$minute" -lt 2 ]; then
            sleep_seconds=$$((120 - minute * 60 - second))
          else
            sleep_seconds=$$((3600 - minute * 60 - second + 120))
          fi
          sleep "$$sleep_seconds"
        done
    restart: unless-stopped

  maintenance:
    build:
      context: .
    image: btc-trading-helper:latest
    environment:
      PYTHONPATH: /app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
    command: python -m src.ops.maintenance --daemon
    restart: unless-stopped
